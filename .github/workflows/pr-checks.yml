# Required PR gate for mootmaker-api. See mootmaker/designs/archive/ci-cd-pipeline.md Decision 12.
#
# Scoped to what actually exists in this repository today, verified rather than assumed:
# impl/ is the deployable Maven module and the only one that can run without AWS.
#
# NEVER add verify/ here. That module is the acceptance suite and needs a real deployed
# environment; PR checks never touch AWS. Acceptance runs in release-build.yml against a
# fresh ephemeral environment instead.
#
# The job name below is the branch-protection contract. Once main requires the
# "unit-tests" context, renaming this job leaves every PR stuck on "Expected - waiting for
# status" with no way to merge. Treat it as frozen.
name: PR checks

on:
  pull_request:
    # No `branches:` filter, deliberately. That filter matches the PR's BASE, so restricting it to
    # main silently exempts every stacked pull request from this gate - a PR based on another PR is
    # not based on main, so no run fires at all. That is what happened to #49 through #52: each was
    # based on the one below it, none of them ran these checks, and they only got tested at all
    # because they were merged down into #48, which does target main.
    #
    # 'edited' below is the same family of problem and neither line fixes the other. Without the
    # types, a retargeted PR never re-runs; without removing this filter, a stacked PR never runs in
    # the first place.
    #
    # 'edited' is here for STACKED PRs, and is not optional. The default activity types are
    # opened/synchronize/reopened; retargeting a PR's base branch is none of those, it is 'edited'.
    # So when PR B is stacked on PR A and A merges, GitHub retargets B to main and fires no run -
    # leaving B stuck on "Expected - waiting for status" forever, with no push left to trigger it,
    # because main's protection requires the unit-tests context below.
    # 'labeled' and 'unlabeled' let the schema-compatible override label take effect without a push.
    # The cost is a run on title and body edits too; the suite is ~25s and the concurrency group
    # below cancels anything in flight, so that is the cheaper side of the trade.
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
  # Lets the gate be re-run without pushing an empty commit.
  workflow_dispatch:

permissions:
  contents: read

# A new push supersedes the previous run; nothing here touches shared state, so cancelling
# mid-flight is safe. Deliberately unlike release.yml, which queues rather than cancels.
concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Its own job rather than a step on unit-tests: the schema is published to consumers who never
  # build this repository's Java, so a schema fault should be legible on its own and should not
  # queue behind a Maven build to be discovered.
  schema-parses:
    name: schema-parses
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      # --no-save: this repository has no package.json to record a dependency in, and does not want
      # one. graphql is a tool this check borrows, not something the API depends on.
      - name: Check the schema parses with standard GraphQL tooling
        run: |
          npm install --no-save graphql@16
          node api/check-schema-parses.mjs api/mootmaker.graphql

  # Installed Android APKs are not replaced when the API deploys, so a breaking schema change breaks
  # phones that are already out there (mootmaker/designs/android-app.md Decision 5). Compares the
  # PR's schema with its base branch's. A deliberate break needs the override label.
  schema-compatible:
    name: schema-compatible
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Diff the schema against the base branch
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          ALLOW_BREAKING: ${{ contains(github.event.pull_request.labels.*.name, 'allow-breaking-schema-change') }}
        run: |
          git show "$BASE_SHA:api/mootmaker.graphql" > "$RUNNER_TEMP/base.graphql"
          npm install --no-save graphql@16 @graphql-inspector/cli@6
          if npx graphql-inspector diff "$RUNNER_TEMP/base.graphql" api/mootmaker.graphql; then
            echo "No breaking schema changes."
          elif [ "$ALLOW_BREAKING" = "true" ]; then
            echo "::warning::Breaking schema change allowed by the allow-breaking-schema-change label."
          else
            echo "::error::Breaking schema change. Installed apps will break. Deprecate instead, or add the allow-breaking-schema-change label if this is deliberate."
            exit 1
          fi

  unit-tests:
    name: unit-tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # Java 25 matches maven.compiler.release in impl/pom.xml. If that moves, this moves.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Unit tests (impl/ only)
        run: mvn -B -ntp -f impl/pom.xml test

  # Separate from unit-tests so a formatting failure reads as a formatting failure, and because
  # that job's name is a branch-protection contract that must not gain or lose steps casually.
  #
  # This one DOES cover verify/, which unit-tests must never do. The rule above is about running
  # that module - the acceptance suite needs a deployed environment and real AWS. Reading it does
  # not: spotless, checkstyle and ecj parse and analyse source, they never execute a test. Its code
  # should be held to the same standard as impl/.
  code-style:
    name: code-style
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Fails if anything is not in google-java-format's Google style. `mvn spotless:apply` fixes it.
      - name: Formatting (google-java-format)
        run: |
          mvn -B -ntp -f impl/pom.xml spotless:check
          mvn -B -ntp -f verify/pom.xml spotless:check

      # google_checks.xml as shipped; our deviations are in config/checkstyle-suppressions.xml.
      - name: Style (Checkstyle, Google ruleset)
        run: |
          mvn -B -ntp -f impl/pom.xml checkstyle:check
          mvn -B -ntp -f verify/pom.xml checkstyle:check

      # Unused imports and friends. javac cannot see these; the editor can, because it is Eclipse
      # JDT. This is that same compiler, so CI and the editor agree.
      - name: Compiler diagnostics (ecj)
        run: ./lint-java.sh
