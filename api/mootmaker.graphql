schema {
 query: Query
 mutation: Mutation
 subscription: Subscription
}

type Query {
    "Everything a screen needs, in one invocation. Sub-fields that are not selected are not fetched: `workspace { days { ... } }` does no people or rooms lookup at all, and `days { meetings { room { id } } }` does none either, because the ids are already on the stored meeting. `dates` is optional - omitting it means no days are wanted, which is how a reference-data-only refresh asks for just rooms and people. At most 42 dates, which covers the calendar's whole span with a week to spare."
    workspace(dates: [String!]): Workspace!

    "Finds every room with capacity >= requiredCapacity that has no meeting overlapping [startTime, endTime), ranked smallest surplus capacity first (rooms of equal capacity break ties by name, so the order is predictable). requiredCapacity is the full headcount (organiser + attendees) - the caller computes it, this does not look up organiser/attendee ids. A user action rather than screen state, so it stays a root field: it has its own arguments and is never part of a page's initial load. Best-effort: invalid or missing arguments return an empty list rather than a structured error list, since this only feeds a suggestion button, not the authoritative createMeeting validation."
    suggestRoom(startTime: String!, endTime: String!, requiredCapacity: Int!): [Room!]!

    "The one lookup that is not a date range, and the reason an id -> date pointer is written alongside every meeting: it resolves in two reads rather than the full-table scan this used to need. Returns null for an id that never existed AND for one whose day has passed out of retention - deliberately the same answer, so callers handle one case, and so nothing confirms that a given id was once valid."
    meeting(id: ID!): Meeting
}

"Everything one screen needs, behind a single field, so a page load is one request and one resolver invocation."
type Workspace {
    "The signed-in caller's own Person, or null if none is linked. Resolved from the caller's `custom:personId` claim, so it costs no lookup to know WHICH person to read - which is what removed the old myPerson -> meetings waterfall. Null for a machine-to-machine token, which has no user behind it at all, and for a confirmed user whose Person creation failed."
    me: Person
    "Every person, in no particular order. Small and slow-moving; fetching it once at page load is what lets every later `attendees { id }` resolve from the client's cache with no further round trip."
    people: [Person!]!
    "Every room, in no particular order. Same reasoning as `people`."
    rooms: [Room!]!
    "One entry per requested date, in the same order, including dates that hold no meetings. Never sparse - a returned empty day means empty, not unfetched, which is what lets a day-keyed client cache tell those two apart."
    days: [Day!]!
    "The window meetings may be viewed and booked in."
    boundaries: Boundaries!
}

"A single date's meetings: the unit of storage, of fetching, and of client-side cache identity."
type Day {
    "ISO-8601 calendar date, e.g. \"2026-09-14\"."
    date: String!
    "Every meeting starting on this date, in no particular order. At most 320."
    meetings: [Meeting!]!
}

"What the server will and will not accept, so no client has to work either boundary out for itself. Computing them client-side would put two authorities on one fact - the server's clock and the browser's - and a user in another time zone would then ask for a day the server already considers expired."
type Boundaries {
    "The earliest date still retained, always a Monday. Stored rather than computed from the clock, and advanced before anything is deleted, so it is never more permissive than what actually exists. Clients bound their back-navigation by it, and writes before it are rejected."
    earliestRetainedDate: String!
    "The latest date a meeting may be booked on, computed per request from the server's today. Clients bound their forward-navigation by it, and writes after it are rejected."
    latestBookableDate: String!
}

type Mutation {
 "Admin only."
 createRoom(room: RoomInput!): CreateRoomResult!
 "Admin only."
 updateRoom(id: ID!, room: RoomInput!): UpdateRoomResult!
 "Admin only."
 createPerson(person: PersonInput!): CreatePersonResult!
 "Allowed for the caller's own linked Person (self-rename), or for anyone if the caller is admin."
 updatePerson(id: ID!, person: PersonInput!): UpdatePersonResult!
 "Returns both the created meeting and its whole updated Day. A caller picks by selection: `{ meeting { id } }` for a small response, or `{ day { date meetings { ... } } }` to have a day-keyed client cache absorb the new state with no update logic at all. Selecting the day is usually free rather than wasteful - the page that creates a meeting normally navigates straight to that date."
 createMeeting(meeting: MeetingInput!): CreateMeetingResult!
 "Day-scoped bulk creation: one operation, one item write. At most 99 meetings per call, because the day item and one id -> date pointer per new meeting are written in a single transaction and DynamoDB caps that at 100 items."
 createMeetings(date: String!, meetings: [MeetingInput!]!): CreateMeetingsResult!
 "Sets the signed-in caller's own date/time display preferences. Self-only - requires a linked Person, and there is no admin override, unlike updatePerson. Purely presentational: does not change the ISO-8601 format this API uses for every date/time it accepts and returns."
 updateMyPreferences(preferences: PreferencesInput!): UpdateMyPreferencesResult!
 "Deletes the signed-in caller's own account: cancels every upcoming meeting they organise, removes them from every upcoming meeting they only attend, deletes their linked Person, then deletes their Cognito user entirely. Past meetings are left untouched. Irreversible. Not available for reserved system accounts (e.g. the demo user), which reject with an error."
 deleteMyAccount: Boolean!

 "NOT FOR CLIENT USE, and not merely by convention - `@aws_iam` means AppSync refuses the call before any resolver runs, so a signed-in user cannot invoke it at all. A publish-only mutation on a NONE data source, called by the resolver Lambda over IAM-signed HTTP after a successful write, purely to drive `Subscription.daysInvalidated`. It exists because `@aws_subscribe` pushes the MUTATION'S return value and requires the subscription field's type to match it: subscribing directly to createMeeting would broadcast rejected bookings (which return successfully, with a typed errors array, rather than failing - verified), and could not also cover createMeetings, whose result type differs."
 publishDaysInvalidated(dates: [String!]!): Invalidation @aws_iam
}

"""
Carries invalidated DATES, never data.

Both type-level directives are REQUIRED, and their absence fails silently - verified on a throwaway API, not read from documentation. The publisher reaches this type over IAM and the subscriber reads it as a Cognito user, so both modes must be named here; with only the field directive on the mutation, subscribing still returns `start_ack` and then delivers nothing forever, and the sole symptom is `Not Authorized to access dates on type Invalidation` on the PUBLISHER's response - inside a Lambda nobody is watching.
"""
type Invalidation @aws_iam @aws_cognito_user_pools {
    dates: [String!]!
}

type Subscription {
    "Carries dates, never data - for four reasons, of which the cap is only the first. AppSync caps a subscription payload at 240 KB (measured: 244,440 bytes delivered, 247,040 did not, and the over-cap publish still returned SUCCESS) against 5 MB for a resolver response, while a worst-case Day is ~618 KB of JSON - so a broadcast cannot carry a day even though a mutation response can. Beyond fitting: the payload is uniform and tiny whatever the day holds; one channel serves every kind of change (create, bulk create, and later history deletion); and it is idempotent, where merging the same meeting twice would need deduplication. The client evicts Day:<date> and its ordinary gap fetch refills it. The 217-day worst case measures 2,861 bytes, about 1.2% of the cap."
    daysInvalidated: Invalidation @aws_subscribe(mutations: ["publishDaysInvalidated"])
}

type Room {
   id: ID!
   name: String!
   capacity: Int!
}

input RoomInput {
   name: String!
   "Must be 2 or more."
   capacity: Int!
}

"Room and person mutations return the whole collection alongside the changed entity. A normalising client cache updates an entity by id everywhere it is referenced, but returning one room does NOT add it to a cached `rooms` list - that is a separate cache field. Returning the list makes the mutation self-sufficient, and both collections are small enough that it costs nothing."
type CreateRoomResult {
    "Every room after the change, so a client can replace its cached list wholesale rather than merging."
    rooms: [Room!]!
    "Populated when the room passed all validation rules and was created."
    room: Room
    "Non-empty when the room was rejected; one entry per validation rule broken."
    errors: [RoomError!]!
}

type UpdateRoomResult {
    "Every room after the change. See CreateRoomResult."
    rooms: [Room!]!
    "Populated when the room passed all validation rules and was updated."
    room: Room
    "Non-empty when the update was rejected; one entry per validation rule broken."
    errors: [RoomError!]!
}

enum RoomError {
    NameRequired
    CapacityTooLow
    "updateRoom only: id did not match any existing room."
    RoomNotFound
}


type Person {
    id: ID!
    name: String!
    "How this person prefers dates rendered and parsed by clients. Never null; defaults to Iso for anyone who has never chosen."
    dateFormat: DateFormat!
    "How this person prefers times rendered and parsed by clients. Never null; defaults to TwentyFourHour for anyone who has never chosen."
    timeFormat: TimeFormat!
}

input PersonInput {
    name: String!
}

"How a client renders and parses dates. Display only - this API always speaks ISO-8601."
enum DateFormat {
    "MM/DD/YYYY"
    Usa
    "DD/MM/YYYY"
    British
    "YYYY-MM-DD"
    Iso
}

"How a client renders and parses times. Display only - this API always speaks ISO-8601."
enum TimeFormat {
    "HH:mm"
    TwentyFourHour
    "hh:mm A"
    AmPm
}

"Both formats are required - updateMyPreferences replaces the caller's whole preference pair, it does not patch one of them."
input PreferencesInput {
    dateFormat: DateFormat!
    timeFormat: TimeFormat!
}

type UpdateMyPreferencesResult {
    "Populated when the update was applied."
    person: Person
    "Non-empty when the update was rejected; one entry per validation rule broken."
    errors: [PreferencesError!]!
}

enum PreferencesError {
    "The caller has no linked Person, so there is nothing to store a preference against."
    NoLinkedPerson
}

type CreatePersonResult {
    "Every person after the change. See CreateRoomResult."
    people: [Person!]!
    "Populated when the person passed all validation rules and was created."
    person: Person
    "Non-empty when the person was rejected; one entry per validation rule broken."
    errors: [PersonError!]!
}

type UpdatePersonResult {
    "Every person after the change. See CreateRoomResult."
    people: [Person!]!
    "Populated when the update passed all validation rules and was applied."
    person: Person
    "Non-empty when the update was rejected; one entry per validation rule broken."
    errors: [PersonError!]!
}

enum PersonError {
    NameRequired
    "id did not match any existing person."
    PersonNotFound
}

type Meeting {
    id: ID!
    room: Room!
    organiser: Person!
    attendees: [Person!]!
    subject: String!
    "ISO-8601 local date-time with no time-zone offset (java.time.LocalDateTime semantics), e.g. \"2026-07-01T14:30:00\"."
    startTime: String!
    "ISO-8601 local date-time with no time-zone offset (java.time.LocalDateTime semantics), e.g. \"2026-07-01T15:00:00\"."
    endTime: String!
}

input MeetingInput {
    roomId: ID!
    organiserId: ID!
    attendeeIds: [ID!]!
    "Must not be null or blank."
    subject: String!
    "ISO-8601 local date-time with no time-zone offset, must fall on a 15 minute boundary, e.g. \"2026-07-01T14:30:00\". Must be on the same calendar date as endTime - a meeting cannot span midnight."
    startTime: String!
    "ISO-8601 local date-time with no time-zone offset, must fall on a 15 minute boundary, e.g. \"2026-07-01T15:00:00\". Must be on the same calendar date as startTime - a meeting cannot span midnight."
    endTime: String!
}

type CreateMeetingResult {
    "Populated when the meeting passed all validation rules and was created."
    meeting: Meeting
    "The affected day in full, after the write. Because a day is a cache entity keyed by its date, returning it lets a client absorb the new state with no update function - and it removes the read-after-write hazard by construction, since the response IS the new state rather than something to re-read."
    day: Day
    "Non-empty when the meeting was rejected; one entry per validation rule broken."
    errors: [MeetingError!]!
}

type CreateMeetingsResult {
    "The day after every meeting in the call was applied. Whole-day replacement is the natural cache update for a whole-day write."
    day: Day
    "One entry per rejected input, identified by its index in the `meetings` argument. Empty when every meeting was created."
    failures: [MeetingFailure!]!
}

"Which input failed, and why. Indexed rather than echoing the input back, so a large bulk call's response stays small."
type MeetingFailure {
    "Index into the `meetings` argument of the call."
    index: Int!
    errors: [MeetingError!]!
}

enum MeetingError {
    StartMisaligned
    EndMisaligned
    "startTime and endTime fall on different calendar dates - a meeting cannot span midnight."
    SpansMultipleDays
    "endTime is not strictly after startTime (earlier than, or equal to, startTime), on the same calendar date."
    EndBeforeStart
    InsufficientCapacity
    TimeRangeUnavailable
    RoomRequired
    RoomNotFound
    OrganiserRequired
    OrganiserNotFound
    AttendeeNotFound
    SubjectRequired
    "organiserId also appears in attendeeIds - the organiser is already counted as one of the meeting's people and cannot additionally be listed as an attendee."
    OrganiserIsAttendee
    "The day already holds the maximum number of meetings. The DAY is full, not the room - physical capacity exceeds the day limit, so a booking can be refused while a room stands free."
    DayIsFull
    "More attendees than one meeting may carry."
    TooManyAttendees
    "Subject is longer than the limit, which is measured in UTF-8 bytes of NFC-normalised text - so emoji count for more than one character each."
    SubjectTooLong
    "Outside the window meetings may be booked in: further ahead than the booking horizon, or earlier than the retention boundary."
    OutsideBookableRange
    "More meetings in one call than may be created together."
    TooManyMeetingsInOneCall
}


